<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alignment — Step by Step</title>
<style>
  :root{--ink:#0B3B3C;--teal:#0E7C7B;--seafoam:#5EEAD4;--mint:#F0FAF8;--gold:#F6C445;
    --goldbg:#FBEFC8;--coral:#E9724C;--muted:#5B7373;--text:#12312F;--line:#D5E8E5;--srcbg:#D8F2ED;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#fff;color:var(--text);padding:22px 16px;line-height:1.45;}
  .wrap{max-width:960px;margin:0 auto;}
  h1{font-size:23px;color:var(--ink);margin-bottom:3px;}
  .sub{color:var(--muted);font-size:14px;margin-bottom:16px;}
  .tabs{display:flex;gap:8px;margin-bottom:16px;}
  .tab{border:2px solid var(--line);background:#fff;color:var(--muted);font-weight:700;
    padding:10px 16px;border-radius:11px;cursor:pointer;font-size:14px;}
  .tab.on{background:var(--teal);color:#fff;border-color:var(--teal);}
  .section{display:none;} .section.on{display:block;}
  .setup{background:var(--mint);border-radius:12px;padding:11px 15px;margin-bottom:14px;font-size:13.5px;}
  .setup .seq{font-family:"Courier New",monospace;font-weight:700;color:#0D9488;font-size:15px;}
  .controls{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .btn{border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;}
  .btn.primary{background:var(--teal);color:#fff;} .btn.primary:hover{background:#0c6b6a;}
  .btn.ghost{background:var(--mint);color:var(--teal);border:2px solid #E1F1EE;}
  .btn:disabled{opacity:.4;cursor:default;}
  .stepinfo{font-size:13px;font-weight:700;color:var(--ink);margin-left:4px;}
  .stepinfo span{color:var(--muted);font-weight:400;}
  .layout{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;}
  .matrixbox{flex:1 1 auto;}
  .panel{flex:0 0 300px;min-width:270px;}
  table.mx{border-collapse:separate;border-spacing:0;}
  table.mx td{width:42px;height:40px;text-align:center;vertical-align:middle;
    font-family:"Courier New",monospace;font-weight:700;font-size:15px;border:1px solid var(--line);
    background:#fff;color:var(--text);}
  td.hdr{background:var(--ink);color:#fff;border-color:var(--ink);}
  td.hdr.lit{background:var(--teal);}
  td.blank{background:#fafcfc;color:transparent;}
  td.path{background:var(--goldbg);}
  td.final-g{background:var(--gold);color:var(--ink);}
  td.final-l{background:var(--coral);color:#fff;}
  td.source{background:var(--srcbg);box-shadow:inset 0 0 0 2px var(--teal);}
  td.current{box-shadow:inset 0 0 0 3px var(--ink);}
  .legend{margin-top:12px;font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:12px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid var(--line);}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .card h3{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--teal);margin-bottom:9px;}
  .celltitle{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:3px;}
  .cellsub{font-size:12.5px;color:var(--muted);margin-bottom:10px;}
  .opt{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;margin-bottom:6px;
    font-family:"Courier New",monospace;font-size:13px;background:var(--mint);}
  .opt .dir{font-weight:800;min-width:72px;color:var(--muted);}
  .opt.win{background:var(--srcbg);box-shadow:inset 0 0 0 2px var(--teal);color:var(--ink);font-weight:700;}
  .opt.win .dir{color:var(--teal);}
  .best{margin-top:8px;font-size:13.5px;font-weight:700;color:var(--ink);} .best b{color:var(--teal);}
  .al{font-family:"Courier New",monospace;font-weight:700;font-size:15px;background:var(--ink);
    color:var(--seafoam);border-radius:8px;padding:9px 11px;white-space:pre;margin:8px 0 4px;line-height:1.5;}
  .scoreline{font-size:14px;} .scoreline b{color:var(--teal);font-size:16px;}
  @media(max-width:640px){.panel{flex:1 1 100%;}table.mx td{width:38px;height:36px;font-size:14px;}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Alignment — Step by Step</h1>
  <div class="sub">Press <b>Next</b> to fill the grid one cell at a time. Each step shows how that cell is built. When the grid is full, the trace-back lights up cell by cell and the alignment appears.</div>
  <div class="tabs">
    <button class="tab on" data-t="global">Global · Needleman&ndash;Wunsch</button>
    <button class="tab" data-t="local">Local · Smith&ndash;Waterman</button>
  </div>
  <div class="section on" id="sec-global"></div>
  <div class="section" id="sec-local"></div>
</div>
<script>
const CFG={
  global:{s1:"GACTT",s2:"GATT",ma:1,mi:-1,ga:-1,local:false},
  local:{s1:"TACGT",s2:"ACGTA",ma:2,mi:-1,ga:-2,local:true},
};

function compute(cfg){
  const {s1,s2,ma,mi,ga,local}=cfg,n=s1.length,m=s2.length;
  const F=Array.from({length:n+1},()=>Array(m+1).fill(0));
  if(!local){for(let i=1;i<=n;i++)F[i][0]=F[i-1][0]+ga;for(let j=1;j<=m;j++)F[0][j]=F[0][j-1]+ga;}
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){
    const sc=s1[i-1]===s2[j-1]?ma:mi;
    let b=Math.max(F[i-1][j-1]+sc,F[i-1][j]+ga,F[i][j-1]+ga); if(local)b=Math.max(0,b);
    F[i][j]=b;
  }
  let fi,fj;
  if(!local){fi=n;fj=m;} else {let best=0;fi=0;fj=0;for(let i=0;i<=n;i++)for(let j=0;j<=m;j++)if(F[i][j]>best){best=F[i][j];fi=i;fj=j;}}
  const traceOrder=[[fi,fj]], edgeDir=[]; let i=fi,j=fj;
  const cont=()=> local ? (F[i][j]>0) : (i>0||j>0);
  while(cont()){
    const sc=(i>0&&j>0&&s1[i-1]===s2[j-1])?ma:mi; let dir,ni,nj;
    if(i>0&&j>0&&F[i][j]===F[i-1][j-1]+sc){dir='diag';ni=i-1;nj=j-1;}
    else if(i>0&&F[i][j]===F[i-1][j]+ga){dir='up';ni=i-1;nj=j;}
    else {dir='left';ni=i;nj=j-1;}
    edgeDir.push({dir,ci:i,cj:j});
    i=ni;j=nj;
    if(local && F[i][j]<=0) break;      // don't add the terminal 0 cell
    traceOrder.push([i,j]);
  }
  // columns left->right
  const colsRev=edgeDir.map(e=>{
    if(e.dir==='diag') return {top:s1[e.ci-1],bottom:s2[e.cj-1],dir:'diag'};
    if(e.dir==='up')   return {top:s1[e.ci-1],bottom:'-',dir:'up'};
    return {top:'-',bottom:s2[e.cj-1],dir:'left'};
  });
  const cols=colsRev.slice().reverse();
  const a1=cols.map(c=>c.top).join(''), a2=cols.map(c=>c.bottom).join('');
  return {F,n,m,traceOrder,cols,a1,a2,finalCell:[fi,fj],score:F[fi][fj]};
}

function candidates(cfg,F,i,j){
  const {s1,s2,ma,mi,ga,local}=cfg;
  if(!local&&i===0&&j===0) return {init:true,text:"Origin: aligning nothing with nothing = 0.",val:0};
  if(!local&&i===0) return {init:true,text:`Border: first ${j} letter(s) of B against gaps → ${j} × gap(${ga}) = ${F[0][j]}.`,val:F[0][j],src:[[0,j-1]]};
  if(!local&&j===0) return {init:true,text:`Border: first ${i} letter(s) of A against gaps → ${i} × gap(${ga}) = ${F[i][0]}.`,val:F[i][0],src:[[i-1,0]]};
  if(local&&(i===0||j===0)) return {init:true,text:"Border: a local match can start anywhere, so this is 0.",val:0};
  const a=s1[i-1],b=s2[j-1],same=a===b,sc=same?ma:mi;
  const dg=F[i-1][j-1]+sc,up=F[i-1][j]+ga,lf=F[i][j-1]+ga;
  const opts=[
    {dir:"\u2196 diagonal",val:dg,text:`${F[i-1][j-1]} ${sc>=0?'+':'\u2212'}${Math.abs(sc)} = ${dg}`,src:[i-1,j-1],note:same?"match":"mismatch"},
    {dir:"\u2191 up",val:up,text:`${F[i-1][j]} \u2212${Math.abs(ga)} = ${up}`,src:[i-1,j],note:"gap"},
    {dir:"\u2190 left",val:lf,text:`${F[i][j-1]} \u2212${Math.abs(ga)} = ${lf}`,src:[i,j-1],note:"gap"},
  ];
  if(local) opts.push({dir:"\u25aa floor",val:0,text:"0 (never below zero)",src:null,note:"reset"});
  const best=Math.max(...opts.map(o=>o.val));
  return {compared:[a,b],same,opts,best,winners:opts.filter(o=>o.val===best),i,j};
}

function makeSection(key){
  const cfg=CFG[key], R=compute(cfg);
  const interior=[]; for(let i=1;i<=R.n;i++)for(let j=1;j<=R.m;j++)interior.push([i,j]);
  const L=R.cols.length;
  // steps: init(1) + fill(n*m) + trace(L+1) + done(1)
  const steps=[{ph:'init'}];
  interior.forEach((c,k)=>steps.push({ph:'fill',k}));
  for(let t=0;t<=L;t++)steps.push({ph:'trace',t});
  steps.push({ph:'done'});
  return {key,cfg,R,interior,L,steps,idx:0};
}

const SEC={global:null,local:null};

function render(sec){
  const {cfg,R,interior,L,steps,idx}=sec;
  const st=steps[idx];
  const host=document.getElementById("sec-"+sec.key);
  // determine reveal + highlights
  let revealCount = st.ph==='init'?0 : st.ph==='fill'? st.k+1 : interior.length;
  const orderIndex = (i,j)=> (i-1)*R.m + (j-1);   // interior order index
  const pathCells=new Set(); let currentCell=null, sources=[], litR=null, litC=null;
  if(st.ph==='fill'){ const [ci,cj]=interior[st.k]; currentCell=ci+","+cj;
    const info=candidates(cfg,R.F,ci,cj);
    if(!info.init){litR=ci;litC=cj;} info.winners&&info.winners.forEach(o=>{if(o.src)sources.push(o.src);});
  }
  if(st.ph==='trace'||st.ph==='done'){
    const upto = st.ph==='done'? R.traceOrder.length-1 : Math.min(st.t, R.traceOrder.length-1);
    for(let k=0;k<=upto;k++)pathCells.add(R.traceOrder[k][0]+","+R.traceOrder[k][1]);
    if(st.ph==='trace') currentCell=R.traceOrder[Math.min(st.t,R.traceOrder.length-1)].join(",");
  }
  // build table
  let html=`<table class="mx"><tr><td class="hdr"></td><td class="hdr">-</td>`;
  for(let j=0;j<R.m;j++)html+=`<td class="hdr" id="ch-${sec.key}-${j+1}">${cfg.s2[j]}</td>`;
  html+='</tr>';
  for(let i=0;i<=R.n;i++){
    const lab=i===0?'-':cfg.s1[i-1];
    html+=`<tr><td class="hdr" id="rh-${sec.key}-${i}">${lab}</td>`;
    for(let j=0;j<=R.m;j++){
      const isBorder = (i===0||j===0);
      const isInterior = !isBorder;
      const revealed = isBorder || (orderIndex(i,j) < revealCount);
      let cls="";
      if(!revealed) cls="blank";
      const id=i+","+j;
      if(revealed && pathCells.has(id)) cls+=" path";
      if(revealed && id===(R.finalCell.join(",")) && (st.ph==='trace'||st.ph==='done')) cls+= cfg.local?" final-l":" final-g";
      if(id===currentCell) cls+=" current";
      if(sources.some(s=>s[0]===i&&s[1]===j)) cls+=" source";
      const val = revealed ? R.F[i][j] : "";
      html+=`<td class="${cls.trim()}" id="c-${sec.key}-${i}-${j}">${val}</td>`;
    }
    html+='</tr>';
  }
  html+='</table>';
  // panel
  let panel="";
  if(st.ph==='init'){
    panel=`<div class="celltitle">Set up the borders</div>
      <div class="cellsub">${cfg.local
        ? "Local alignments can begin anywhere, so the whole first row and column are 0. Press Next to fill the first interior cell."
        : "The first row and column are just the gap penalty piling up (a prefix aligned against gaps). Press Next to fill the first interior cell."}</div>`;
  } else if(st.ph==='fill'){
    const [ci,cj]=interior[st.k]; const info=candidates(cfg,R.F,ci,cj);
    if(info.init){ panel=`<div class="celltitle">Value = ${info.val}</div><div class="cellsub">${info.text}</div>`; }
    else{
      let opts=""; info.opts.forEach(o=>{const win=o.val===info.best;
        opts+=`<div class="opt ${win?'win':''}"><span class="dir">${o.dir}</span><span>${o.text}</span><span style="margin-left:auto;color:var(--muted)">${o.note}</span></div>`;});
      const dirs=info.winners.map(o=>o.dir).join(" or ");
      panel=`<div class="celltitle">Comparing A = ${info.compared[0]} with B = ${info.compared[1]}</div>
        <div class="cellsub">${info.same?`same letter → match`:`different → mismatch`}. Try all moves, keep the biggest:</div>
        ${opts}
        <div class="best">Cell = <b>${info.best}</b>, from ${dirs}. (green = where it came from)</div>`;
    }
  } else if(st.ph==='trace'){
    const t=st.t;
    const topStr=R.cols.map((c,k)=>k>=L-t?c.top:'·').join(' ');
    const botStr=R.cols.map((c,k)=>k>=L-t?c.bottom:'·').join(' ');
    const matStr=R.cols.map((c,k)=>(k>=L-t&&c.top===c.bottom&&c.top!=='-')?'|':' ').join(' ');
    let note;
    if(t===0){ note=`Start at the ${cfg.local?'highest cell':'bottom-right cell'} (score ${R.score}). Now walk back along the arrows.`; }
    else{ const c=R.cols[L-t]; note = c.dir==='diag'
        ? `Diagonal step: align <b>${c.top}</b> with <b>${c.bottom}</b>.`
        : c.dir==='up' ? `Up step: <b>${c.top}</b> meets a gap.` : `Left step: a gap meets <b>${c.bottom}</b>.`; }
    panel=`<div class="celltitle">Trace-back ${t}/${L}</div>
      <div class="cellsub">${note}</div>
      <div class="al">A:  ${topStr}\n    ${matStr}\nB:  ${botStr}</div>`;
  } else { // done
    const topStr=R.a1.split('').join(' '), botStr=R.a2.split('').join(' ');
    const matStr=R.cols.map(c=>(c.top===c.bottom&&c.top!=='-')?'|':' ').join(' ');
    panel=`<div class="celltitle">Done</div>
      <div class="cellsub">${cfg.local?'Best local match (flanks trimmed):':'Optimal global alignment:'}</div>
      <div class="al">A:  ${topStr}\n    ${matStr}\nB:  ${botStr}</div>
      <div class="scoreline">${cfg.local?'Best local score':'Alignment score'} = <b>${R.score}</b></div>`;
  }
  const total=steps.length-1;
  const phaseLabel = st.ph==='init'?'Initialise' : st.ph==='fill'?`Fill cell ${st.k+1} of ${interior.length}`
    : st.ph==='trace'?`Trace-back` : 'Complete';
  host.innerHTML=`
    <div class="setup">Sequence A (rows) = <span class="seq">${cfg.s1}</span> &nbsp;·&nbsp; B (columns) = <span class="seq">${cfg.s2}</span>
      &nbsp;·&nbsp; match +${cfg.ma}, mismatch ${cfg.mi}, gap ${cfg.ga}${cfg.local?', floor 0':''}</div>
    <div class="controls">
      <button class="btn ghost" id="back-${sec.key}">◀ Back</button>
      <button class="btn primary" id="next-${sec.key}">Next ▶</button>
      <button class="btn ghost" id="reset-${sec.key}">⟳ Reset</button>
      <span class="stepinfo">${phaseLabel} <span>· step ${idx} / ${total}</span></span>
    </div>
    <div class="layout">
      <div class="matrixbox">${html}
        <div class="legend">
          <span><i class="sw" style="background:var(--goldbg)"></i> path</span>
          <span><i class="sw" style="background:${cfg.local?'var(--coral)':'var(--gold)'}"></i> ${cfg.local?'highest cell':'final cell'}</span>
          <span><i class="sw" style="background:var(--srcbg);box-shadow:inset 0 0 0 2px var(--teal)"></i> came from</span>
          <span><i class="sw" style="box-shadow:inset 0 0 0 3px var(--ink)"></i> current cell</span>
        </div>
      </div>
      <div class="panel"><div class="card">${panel}</div></div>
    </div>`;
  if(litR!=null){const e=document.getElementById(`rh-${sec.key}-${litR}`);if(e)e.classList.add("lit");}
  if(litC!=null){const e=document.getElementById(`ch-${sec.key}-${litC}`);if(e)e.classList.add("lit");}
  // wire buttons
  document.getElementById(`next-${sec.key}`).disabled = idx>=total;
  document.getElementById(`back-${sec.key}`).disabled = idx<=0;
  document.getElementById(`next-${sec.key}`).onclick=()=>{if(sec.idx<total){sec.idx++;render(sec);}};
  document.getElementById(`back-${sec.key}`).onclick=()=>{if(sec.idx>0){sec.idx--;render(sec);}};
  document.getElementById(`reset-${sec.key}`).onclick=()=>{sec.idx=0;render(sec);};
}

document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(".section").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); document.getElementById("sec-"+b.dataset.t).classList.add("on");
}));

SEC.global=makeSection("global"); render(SEC.global);
SEC.local=makeSection("local");  render(SEC.local);
</script>
</body>
</html>
