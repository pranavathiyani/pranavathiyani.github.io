<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz - Bioinformatics I</title>
<style>
body{margin:0;background:#f5f6f8;color:#172033;font-family:Arial,sans-serif}
.wrap{max-width:850px;margin:auto;padding:25px 16px}.card{background:#fff;border:1px solid #d9dee7;border-radius:14px;padding:24px;box-shadow:0 5px 20px #0001}
.center{text-align:center}.hidden{display:none!important}.muted{color:#667085}label{display:block;font-weight:bold;margin:20px 0 8px}
input{width:100%;padding:12px;box-sizing:border-box;border:1px solid #ccd3df;border-radius:9px;font-size:16px}
button{font:inherit}.primary{background:#7c3aed;color:#fff;border:0;border-radius:9px;padding:11px 18px;font-weight:bold;cursor:pointer}.primary:disabled{opacity:.45;cursor:not-allowed}
.top{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px}.timer{font-size:26px;font-weight:800;color:#7c3aed}.bar{height:7px;background:#e5e7eb;border-radius:99px;margin-bottom:18px}.fill{height:100%;background:#7c3aed}
.question{font-size:20px;font-weight:bold;line-height:1.45;margin-bottom:16px}.option{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid #d9dee7;border-radius:10px;padding:13px;margin:9px 0;cursor:pointer}.option.selected{background:#f3e8ff;border-color:#7c3aed}
.actions{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:18px}.fact{display:none;margin-top:18px;padding:13px 15px;border:1px solid #d9dee7;border-radius:10px;background:#fafafa}.fact.visible{display:block}.fact-title{font-size:12px;font-weight:800;color:#7c3aed;text-transform:uppercase;margin-bottom:5px}.fact-text{font-size:14px;line-height:1.5}
.answer{padding:12px;margin:8px 0;background:#fafafa;border-left:3px solid #7c3aed;border-radius:7px;font-size:14px}.score{font-size:24px;font-weight:bold;margin:12px 0}.error{color:#b42318;font-size:14px;margin-top:7px}
@media(max-width:600px){.actions{flex-direction:column;align-items:stretch}}
</style></head><body><div class="wrap" id="app">
<section id="intro" class="card"><div class="center"><h1>Quiz - Bioinformatics I</h1><p class="muted">Sequence Similarity, Alignment, Database Searching, Multiple Sequence Analysis & Molecular Evolution</p></div>
<label for="name">Name</label><input id="name" autocomplete="off" placeholder="Enter your full name"><div id="err" class="error hidden">Please enter your name.</div>
<div class="center" style="margin-top:18px"><button id="start" class="primary">Start Quiz</button></div></section>
<section id="quiz" class="hidden"><div class="top"><div><strong id="student"></strong><div id="progress" class="muted"></div></div><div class="center"><div class="muted">Question timer</div><div id="timer" class="timer">20</div></div></div>
<div class="bar"><div id="fill" class="fill"></div></div><div id="qcard" class="card"></div></section>
<section id="result" class="card hidden"></section><section id="ended" class="card hidden center"><h2>Attempt ended</h2><p class="muted">The quiz detected that the page was left during the attempt.</p></section>
</div><script>
(()=>{const D=20,BANK=[{q:'Main purpose of a sequence similarity search?',o:['Find similar biological sequences', 'Measure protein mass', 'Assemble chromosomes', 'Predict microscope images'],a:0},{q:'Sequence identity means:',o:['Exact matching positions as a percentage', 'Chemically similar residues only', 'Number of gaps', 'Database length'],a:0},{q:'Sequence similarity can include:',o:['Identical and biologically similar substitutions', 'Only exact matches', 'Only gaps', 'Only nucleotides'],a:0},{q:'A global alignment attempts to:',o:['Align sequences across their overall lengths', 'Find only one short region', 'Search a protein database', 'Find motifs only'],a:0},{q:'A local alignment attempts to:',o:['Find the best matching regions within sequences', 'Align every position end-to-end', 'Avoid substitutions', 'Use only nucleotide sequences'],a:0},{q:'Semi-global alignment is useful when:',o:['Terminal gaps should not be strongly penalized', 'No gaps are allowed', 'Only proteins are used', 'Sequences are unrelated'],a:0},{q:'Needleman-Wunsch is associated with:',o:['Global pairwise alignment', 'Local pairwise alignment', 'BLASTN', 'FASTA3'],a:0},{q:'Smith-Waterman is associated with:',o:['Local pairwise alignment', 'Global pairwise alignment', 'BLOSUM', 'PSI-BLAST'],a:0},{q:'Why are gap penalties used?',o:['To discourage excessive or unlikely gaps', 'To remove substitutions', 'To increase database size', 'To force identical sequences'],a:0},{q:'A substitution matrix provides:',o:['Scores for replacing one residue with another', 'Genome coordinates', 'Only gap positions', 'Accession numbers'],a:0},{q:'PSSM stands for:',o:['Position-Specific Scoring Matrix', 'Protein Sequence Search Method', 'Pairwise Similarity Sequence Model', 'Position Search Substitution Method'],a:0},{q:'A PSSM can represent:',o:['Position-specific conservation', 'Only sequence length', 'Only nucleotide identity', 'Only gap counts'],a:0},{q:'BLOSUM matrices are primarily used for:',o:['Amino-acid substitution scoring', 'Genome assembly', 'Read compression', 'RNA quantification'],a:0},{q:'BLOSUM matrices are derived from:',o:['Conserved blocks of protein sequences', 'Random sequencing reads', 'Genome coordinates', 'RNA expression tables'],a:0},{q:'A higher BLOSUM number generally corresponds to:',o:['More closely related sequences used to construct the matrix', 'More distant sequences only', 'Longer gaps', 'Nucleotide reads'],a:0},{q:'FASTA3 is:',o:['A sequence similarity-search program package', 'A phylogenetic tree format', 'A substitution matrix', 'A genome assembler'],a:0},{q:'BLAST is mainly designed for:',o:['Rapid sequence similarity searching', 'Protein purification', 'Genome visualization only', 'RNA extraction'],a:0},{q:'BLAST uses heuristics mainly to:',o:['Make similarity searches much faster', 'Guarantee every optimal global alignment', 'Delete database sequences', 'Predict structures directly'],a:0},{q:'BLASTP searches:',o:['Protein against protein', 'Nucleotide against nucleotide', 'Protein against DNA only', 'RNA against RNA only'],a:0},{q:'BLASTN searches:',o:['Nucleotide against nucleotide', 'Protein against protein', 'Protein against translated DNA only', 'Motifs against structures'],a:0},{q:'PSI-BLAST is useful for:',o:['Detecting more distant protein relationships using profiles', 'Aligning two whole genomes globally', 'Searching nucleotide databases only', 'Building trees only'],a:0},{q:'PSI-BLAST builds its profile using:',o:['Significant matches from earlier iterations', 'Random database sequences', 'Only the original query', 'Tree branch lengths'],a:0},{q:'PHI-BLAST combines:',o:['Pattern searching with protein similarity searching', 'RNA-seq with assembly', 'Torrent transfer with alignment', 'Global and semi-global alignment'],a:0},{q:'DELTA-BLAST uses:',o:['Conserved-domain information to improve remote homology detection', 'Only nucleotide k-mers', 'Only exact protein matches', 'Phylogenetic branch lengths'],a:0},{q:'A BLAST E-value estimates:',o:['Expected chance matches of similar quality', 'Percentage identity', 'Number of gaps', 'Sequence length'],a:0},{q:'A smaller BLAST E-value generally indicates:',o:['A more statistically significant match', 'A weaker match', 'A longer query automatically', 'More sequencing errors'],a:0},{q:'Why search a database after obtaining a new sequence?',o:['Similar known sequences can provide functional clues', 'It proves pathogenicity', 'It removes the need for alignment', 'It converts DNA to protein'],a:0},{q:'A multiple sequence alignment contains:',o:['Three or more aligned sequences', 'Exactly two sequences', 'Only accession numbers', 'Only tree branches'],a:0},{q:'An important use of an MSA is finding:',o:['Conserved positions and regions', 'Only sequencing errors', 'Only chromosome numbers', 'Database size'],a:0},{q:'A consensus sequence represents:',o:['The predominant character at each aligned position', 'The longest sequence', 'The first sequence', 'The root of a tree'],a:0},{q:'A highly conserved position may suggest:',o:['Functional or structural importance', 'An intron in every organism', 'Unrelated sequences', 'An invalid alignment'],a:0},{q:'Motif discovery means:',o:['Finding recurring sequence patterns with possible biological significance', 'Deleting repeated sequences', 'Converting protein to DNA', 'Measuring sequencing coverage'],a:0},{q:'Motifs can indicate:',o:['Functional, regulatory or structural features', 'Complete genes in every case', 'Only sequencing errors', 'Database size'],a:0},{q:'Gene prediction aims to identify:',o:['Likely genes and coding regions', 'Protein molecular weight only', 'Sequencing adapters', 'Phylogenetic branches'],a:0},{q:'Conservation can help gene prediction because:',o:['Conserved regions can provide evidence for functional or coding regions', 'It prevents mutations', 'It automatically removes introns', 'It replaces sequencing'],a:0},{q:'A major challenge in genome read alignment is:',o:['The huge number of reads and possible reference positions', 'Lack of sequence information', 'DNA being impossible to store', 'Every read being identical'],a:0},{q:'The Burrows-Wheeler Transform is useful because it:',o:['Supports compact indexing for efficient sequence searches', 'Predicts protein folding', 'Builds phylogenetic trees', 'Measures RNA expression'],a:0},{q:'The FM-index is associated with:',o:['BWT-based sequence searching', 'BLOSUM scoring', 'RNA expression', 'FASTA formatting'],a:0},{q:'BWT-based methods are attractive for short reads because:',o:['They support efficient searches with compact indexing', 'They require every read to be globally aligned', 'They work only on proteins', 'They remove the reference genome'],a:0},{q:'Molecular phylogeny studies:',o:['Evolutionary relationships among organisms or sequences', 'Protein molecular weight', 'File formats', 'Sequencing quality only'],a:0},{q:'A phylogenetic tree represents:',o:['A hypothesis about evolutionary relationships', 'Only sequence identity', 'Storage locations', 'Read counts'],a:0},{q:'Neighbor-Joining is:',o:['A distance-based tree-building method', 'A local alignment algorithm', 'A substitution matrix', 'A sequence database'],a:0},{q:'UPGMA is:',o:['A distance-based hierarchical clustering method', 'A local alignment algorithm', 'A protein matrix', 'A BLAST algorithm'],a:0},{q:'Maximum parsimony seeks a tree requiring:',o:['The fewest evolutionary changes', 'The most substitutions', 'The longest branches', 'The most gaps'],a:0},{q:'Phylogenetic trees should be interpreted as hypotheses because:',o:['They depend on data, models and assumptions', 'They are always experimentally proven', 'They contain no uncertainty', 'They ignore sequence alignment'],a:0}],FACTS=['Identity counts exact matches at aligned positions.','Similarity may include conservative amino-acid substitutions.','Needleman-Wunsch is the classic global alignment algorithm.','Smith-Waterman is the classic local alignment algorithm.','Semi-global alignment can avoid terminal gap penalties.','Gap penalties influence the preferred alignment.','Substitution matrices score amino-acid replacements.','PSSMs capture position-specific conservation.','BLOSUM matrices were built from conserved protein blocks.','Different BLOSUM matrices suit different divergence levels.','FASTA is an important early sequence-searching tool.','BLAST provides rapid heuristic similarity searches.','BLASTP compares protein sequences.','BLASTN compares nucleotide sequences.','PSI-BLAST improves sensitivity using iterative profiles.','PHI-BLAST incorporates a specified pattern into protein searching.','DELTA-BLAST uses conserved-domain information.','A lower BLAST E-value generally indicates stronger statistical evidence.','Database searches can suggest the function of an unknown sequence.','An MSA aligns three or more sequences.','MSAs reveal conserved and variable positions.','A consensus sequence summarises the predominant character at each position.','Conserved residues can indicate functional importance.','Motifs are recurring patterns that may have biological significance.','Gene prediction identifies candidate genes and coding regions.','Genome-scale alignment is computationally demanding.','Repeated genomic regions can complicate read alignment.','The Burrows-Wheeler Transform supports efficient indexed searching.','FM-indexes are closely associated with BWT-based searching.','BWT-based indexes can be compact and fast for short-read searching.','Phylogeny uses sequence characters to infer evolutionary relationships.','Neighbor-Joining is a distance-based phylogenetic method.','UPGMA is hierarchical clustering applied to distance data.','Maximum parsimony favours trees requiring fewer evolutionary changes.','Tree results depend on alignment quality and model assumptions.','Poor alignments can produce misleading phylogenetic relationships.','Homologous positions should represent corresponding evolutionary positions.','Sequence alignment is fundamental to comparative bioinformatics.','Similarity searches can identify candidate homologs.','Conserved motifs can connect sequence patterns to function.','Protein substitution matrices reflect evolutionary replacement tendencies.','An alignment score depends on substitution scores and gap penalties.','MSAs can reveal rapidly evolving and conserved regions.','Phylogenetic inference is sensitive to sequence choice and alignment quality.','Efficient indexing is important for very large genomic references.','Bioinformatics combines searching, alignment, conservation and evolutionary analysis.','Sequence alignment is fundamental to comparative bioinformatics.','Similarity searches can identify candidate homologs.','Conserved motifs can connect sequence patterns to function.','Protein substitution matrices reflect evolutionary replacement tendencies.'];let qs=[],idx=0,sel=null,left=D,answers=[],active=false,timer=null,factTimer=null;
const $=x=>document.getElementById(x),intro=$("intro"),quiz=$("quiz"),result=$("result"),ended=$("ended"),card=$("qcard"),name=$("name");
const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function factsStart(){clearInterval(factTimer);let e=$("factText"),i=Math.floor(Math.random()*FACTS.length);if(!e)return;e.textContent=FACTS[i];factTimer=setInterval(()=>{i=(i+1)%FACTS.length;e.textContent=FACTS[i]},5000)}
function timerStart(){clearInterval(timer);left=D;$("timer").textContent=left;timer=setInterval(()=>{left--;$("timer").textContent=left;if(left<=0){clearInterval(timer);$("next").disabled=sel===null;$("timerNote").textContent=sel===null?"Select an answer to continue.":"You may now submit your answer."}},1000)}
function render(){clearInterval(factTimer);sel=null;const x=qs[idx];$("progress").textContent=`Question ${idx+1} of 45`;$("fill").style.width=`${idx/45*100}%`;card.innerHTML="";
let q=document.createElement("div");q.className="question";q.textContent=x.q;card.appendChild(q);let os=document.createElement("div");
x.o.forEach((v,i)=>{let b=document.createElement("button");b.type="button";b.className="option";b.innerHTML=`<b>${String.fromCharCode(65+i)}.</b><span>${esc(v.text)}</span>`;b.onclick=()=>{if(!active)return;sel=i;os.querySelectorAll(".option").forEach(z=>z.classList.remove("selected"));b.classList.add("selected");let f=card.querySelector(".fact");f.style.display="block";f.classList.add("visible");factsStart();if(left<=0)$("next").disabled=false};os.appendChild(b)});card.appendChild(os);
let act=document.createElement("div");act.className="actions";act.innerHTML='<span id="timerNote" class="muted">Select an answer. A fact will appear while you wait.</span><button id="next" class="primary" disabled>Submit Answer</button>';card.appendChild(act);
let f=document.createElement("div");f.className="fact";f.innerHTML='<div class="fact-title">💡 Bioinformatics fact</div><div id="factText" class="fact-text"></div>';card.appendChild(f);
$("next").onclick=()=>{if(left>0||sel===null)return;answers[idx]=sel;if(idx===44)finish();else{idx++;render()}};timerStart()}
function finish(){active=false;clearInterval(timer);clearInterval(factTimer);quiz.classList.add("hidden");result.classList.remove("hidden");$("fill").style.width="100%";let score=answers.reduce((n,a,i)=>n+(qs[i].o[a]?.correct?1:0),0);let out=`<div class="center"><h1>Quiz Complete</h1><p class="muted">Bioinformatics I</p></div><p>Name: <b>${esc(name.value.trim())}</b></p><div class="score">Score: ${score} / 45</div><h2>Answer Key</h2>`;qs.forEach((x,i)=>{let c=x.o.findIndex(z=>z.correct);out+=`<div class="answer"><b>${i+1}. ${esc(x.q)}</b><br><span class="muted">Correct answer: ${String.fromCharCode(65+c)}. ${esc(x.o[c].text)}</span></div>`});result.innerHTML=out}
function terminate(){if(!active)return;active=false;clearInterval(timer);clearInterval(factTimer);quiz.classList.add("hidden");ended.classList.remove("hidden")}
$("start").onclick=()=>{if(!name.value.trim()){$("err").classList.remove("hidden");name.focus();return}$("err").classList.add("hidden");$("student").textContent=name.value.trim();qs=shuffle(BANK.map(x=>({q:x.q,o:shuffle(x.o.map((t,i)=>({text:t,correct:i===x.a}))) }))).slice(0,45);idx=0;answers=[];intro.classList.add("hidden");quiz.classList.remove("hidden");active=true;render()};
document.addEventListener("contextmenu",e=>{if(active)e.preventDefault()});["copy","cut","paste","dragstart"].forEach(v=>document.addEventListener(v,e=>{if(active)e.preventDefault()}));
document.addEventListener("keydown",e=>{if(!active)return;let k=e.key.toLowerCase();if((e.ctrlKey||e.metaKey)&&["c","x","v","a","s","p","u"].includes(k))e.preventDefault();if(e.key==="F12"||(e.ctrlKey&&e.shiftKey&&["i","j","c"].includes(k)))e.preventDefault()});
document.addEventListener("visibilitychange",()=>{if(active&&document.hidden)terminate()});window.addEventListener("blur",()=>{if(active)terminate()});
})();
</script></body></html>
