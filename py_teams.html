<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Your Team</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#ffffff; --ink:#172033; --muted:#667085;
    --accent:#635bff; --accent2:#8b5cf6; --line:#e5e7eb;
    --success:#087f5b;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:radial-gradient(circle at top,#eef2ff 0,#f7f8fc 38%,#f5f7fb 100%);
    color:var(--ink); display:flex; justify-content:center; align-items:center; padding:24px;
  }
  .app{width:min(680px,100%);}
  .brand{text-align:center;margin-bottom:22px}
  .brand h1{margin:0;font-size:32px;letter-spacing:-.8px}
  .brand p{margin:8px 0 0;color:var(--muted);font-size:15px}
  .card{
    background:rgba(255,255,255,.96); border:1px solid rgba(229,231,235,.9);
    border-radius:24px; box-shadow:0 18px 55px rgba(31,41,55,.10);
    padding:30px;
  }
  label{display:block;font-weight:700;font-size:14px;margin:0 0 8px}
  input{
    width:100%; height:50px; border:1px solid #d7dbe3; border-radius:12px;
    padding:0 15px;font-size:16px;outline:none;transition:.2s;background:#fff;
  }
  input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(99,91,255,.10)}
  .field{margin-bottom:18px}
  button{
    border:0;border-radius:12px;min-height:50px;padding:0 20px;font-size:15px;
    font-weight:800;cursor:pointer;transition:transform .15s,box-shadow .15s,opacity .15s;
  }
  button:hover{transform:translateY(-1px)}
  button:disabled{opacity:.55;cursor:not-allowed;transform:none}
  .primary{width:100%;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 20px rgba(99,91,255,.22)}
  .secondary{background:#f1f3f7;color:#303846;width:100%;margin-top:14px}
  .error{color:#b42318;background:#fff1f0;border:1px solid #ffd5d2;border-radius:10px;padding:11px 13px;font-size:14px;margin-top:14px;display:none}
  .hidden{display:none!important}

  /* Reveal stage */
  .stage{text-align:center;min-height:410px;display:flex;flex-direction:column;justify-content:center;align-items:center}
  .status{font-weight:800;font-size:17px;margin-top:22px}
  .substatus{color:var(--muted);font-size:14px;margin-top:7px}
  .dice{
    width:104px;height:104px;border-radius:22px;background:#fff;border:1px solid #e4e7ec;
    box-shadow:0 15px 35px rgba(31,41,55,.13);display:grid;grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);padding:17px;gap:7px;transform-style:preserve-3d;
  }
  .dice.rolling{animation:roll .65s linear infinite}
  .dot{width:15px;height:15px;background:#202735;border-radius:50%;align-self:center;justify-self:center}
  @keyframes roll{
    0%{transform:rotate(0deg) scale(1)}
    25%{transform:rotate(90deg) scale(1.03)}
    50%{transform:rotate(180deg) scale(1)}
    75%{transform:rotate(270deg) scale(1.03)}
    100%{transform:rotate(360deg) scale(1)}
  }
  .countdown{
    margin-top:18px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums
  }
  .team-reveal{animation:reveal .75s ease both}
  @keyframes reveal{
    from{opacity:0;transform:translateY(18px) scale(.96)}
    to{opacity:1;transform:none}
  }
  .team-label{text-transform:uppercase;letter-spacing:2px;color:var(--muted);font-size:12px;font-weight:900}
  .team-name{
    margin:12px 0 0;font-size:42px;line-height:1.08;letter-spacing:-1.4px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .dice-final{font-size:13px;color:var(--muted);margin-top:15px}
  .members{
    margin-top:22px;text-align:left;border-top:1px solid var(--line);padding-top:20px;
    animation:reveal .45s ease both
  }
  .members h3{margin:0 0 12px;font-size:15px}
  .member{
    display:flex;gap:13px;align-items:center;padding:12px 0;border-bottom:1px solid #eef0f3;
  }
  .member:last-child{border-bottom:0}
  .avatar{
    width:36px;height:36px;border-radius:50%;background:#eef0ff;color:#5148d8;
    display:grid;place-items:center;font-weight:900;font-size:12px;flex:0 0 auto;
  }
  .mname{font-weight:700;font-size:14px}
  .reg{font-size:12px;color:var(--muted);margin-top:2px}
  .note{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}
  .again{margin-top:18px;width:100%}
  @media(max-width:520px){
    .card{padding:22px;border-radius:20px}.team-name{font-size:34px}.brand h1{font-size:27px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="brand">
    <h1>🎲 Find Your Team</h1>
    <p>Enter your registered details to discover your team.</p>
  </div>

  <div class="card">
    <section id="formView">
      <div class="field">
        <label for="reg">Register Number</label>
        <input id="reg" inputmode="numeric" autocomplete="off" placeholder="e.g. 128163014">
      </div>
      <div class="field">
        <label for="name">Student Name</label>
        <input id="name" autocomplete="off" placeholder="Enter your registered name">
      </div>
      <button class="primary" id="findBtn">🎲 Find My Team</button>
      <div class="error" id="error"></div>
      <div class="note">Your register number and name are checked against the class list.</div>
    </section>

    <section id="loadingView" class="stage hidden">
      <div id="dice" class="dice rolling" aria-label="Rolling die"></div>
      <div class="status">Assigning team...</div>
      <div class="substatus">Rolling the dice and revealing your team</div>
      <div class="countdown" id="countdown">10 seconds remaining</div>
    </section>

    <section id="resultView" class="stage hidden">
      <div class="team-reveal">
        <div class="team-label">Your Team</div>
        <div class="team-name" id="teamName"></div>
        <div class="dice-final" id="diceFinal"></div>
        <button class="secondary" id="membersBtn">👥 Show Team Members</button>
        <div id="members" class="members hidden"></div>
        <button class="secondary again" id="againBtn">↩ Check Another Register Number</button>
      </div>
    </section>
  </div>
</div>

<script>
/*
  Team assignments are generated once when this page loads and are then kept
  consistent for everyone using the same page/session.

  IMPORTANT:
  For a classroom deployment where every student must see the same random
  teams, generate the assignment once and save it in this HTML (or on a server).
*/
const students = [
["128162001","Adhithiya V L"],["128162002","Angu Karthika C"],["128162003","Bhuvaneshwaran R"],
["128162004","Celsi Jaya Sreejha P"],["128162005","Dhanavardhini A"],["128162006","Dhavavignesh Rajendran"],
["128162007","Guhan S"],["128162008","Gurram Chenchu Rakesh"],["128162009","Hudson B"],["128162010","Kishore D"],
["128162011","Kodali Bhargav"],["128162012","Kundurthi Vijaya Sai Nisanth"],["128162013","Mithusha S R"],
["128162014","Mohammad Sahir Baig"],["128162015","Monfort Joel J"],["128162016","Samarjith R"],
["128162017","Sivaneswari R"],["128162018","Srihari S"],["128162019","Thanasri J"],
["128162020","Valenteena Vency S"],["128162021","Vasudevan S R"],["128162022","Yogambigai S"],
["128163001","Abdul Aziz M"],["128163002","Angelin Pricilla M"],["128163003","Ashwin R"],
["128163004","Chandra Prasaad M"],["128163005","Dakshana S B"],["128163006","Devadharshini S"],
["128163007","Dhanyaa S U"],["128163008","Divakar B"],["128163009","Hayagrive P"],
["128163010","Hemanth Sivaganesh S P"],["128163011","Karthick Rajan R"],["128163012","Manasa G"],
["128163013","Nithish Sam Kamalesan D"],["128163014","Perzcy Raya B"],["128163015","Pragadeshwaran D P"],
["128163016","Prince Aswin A S"],["128163017","Rohith A"],["128163018","Sampremkumar V"],
["128163019","Sneharaj"],["128163020","Swathi R"],["128163021","Tamilmaran K"],
["128163022","Vengada Ramana M"],["128163023","Venkadesa Prasad S"],["128164001","Arlin Newzina A"],
["128164002","Hema Harshitha J P"],["128164003","Kaviyaashree G"],["128164004","Lokesh S"],
["128164005","Nithish D"],["128164006","Rabisha Jennippar P"],["128164007","Srija R"],
["128164008","Subhikssha B"],["128164009","Sutharrshnaa"],["128164010","Varsha Prakalya M"],
["128164011","Vedashree N N"],["128165001","Abinath T"],["128165002","Lakshmi Nrsimha Rao"],
["128165003","Ashwin R"]
];

const teamNames = [
  "String Fighters","Code Breakers","Byte Busters","Loop Legends",
  "Syntax Squad","Bug Hunters","Python Pioneers","Data Dynamos",
  "Logic Lords","Code Crafters","Binary Beasts","Algorithm Aces"
];

const reg = document.getElementById("reg");
const nameInput = document.getElementById("name");
const findBtn = document.getElementById("findBtn");
const error = document.getElementById("error");
const formView = document.getElementById("formView");
const loadingView = document.getElementById("loadingView");
const resultView = document.getElementById("resultView");
const dice = document.getElementById("dice");
const countdown = document.getElementById("countdown");
const teamName = document.getElementById("teamName");
const diceFinal = document.getElementById("diceFinal");
const membersBtn = document.getElementById("membersBtn");
const members = document.getElementById("members");
const againBtn = document.getElementById("againBtn");

let assignments = null;
let currentTeam = null;

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function makeAssignments(){
  // 58 students -> 10 teams of 5 + 2 teams of 4.
  const shuffled = shuffle(students);
  const groups = Array.from({length:12},()=>[]);
  shuffled.forEach((student,i)=>groups[i % 12].push(student));
  const map = new Map();
  groups.forEach((group,i)=>group.forEach(s=>map.set(s[0],{
    index:i, name:teamNames[i], members:group
  })));
  return map;
}

function drawDie(n){
  dice.innerHTML="";
  const patterns={
    1:[4],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]
  };
  const active=patterns[n] || patterns[1];
  for(let i=1;i<=9;i++){
    const d=document.createElement("span");
    d.className="dot";
    if(!active.includes(i)) d.style.visibility="hidden";
    dice.appendChild(d);
  }
}
drawDie(1);

function normalize(s){return s.trim().replace(/\s+/g," ").toLowerCase();}

findBtn.addEventListener("click",()=>{
  error.style.display="none";
  const r=reg.value.trim();
  const n=normalize(nameInput.value);
  const student=students.find(s=>s[0]===r);

  if(!student){
    error.textContent="Register number not found. Please check and try again.";
    error.style.display="block"; return;
  }

  // The entered name is intentionally NOT used for team mapping or verification.
  // Register number alone determines the student's team.

  // Generate once for this page/session, so repeated lookups remain consistent.
  if(!assignments) assignments=makeAssignments();
  currentTeam=assignments.get(r);

  formView.classList.add("hidden");
  resultView.classList.add("hidden");
  loadingView.classList.remove("hidden");

  let remaining=10;
  countdown.textContent=remaining+" seconds remaining";
  let elapsed=0;
  const timer=setInterval(()=>{
    elapsed++;
    remaining=10-elapsed;
    if(remaining>0) countdown.textContent=remaining+" seconds remaining";
    else countdown.textContent="Revealing your team...";
    drawDie(Math.floor(Math.random()*6)+1);
  },1000);

  setTimeout(()=>{
    clearInterval(timer);
    drawDie(currentTeam.index+1);
    dice.classList.remove("rolling");
    loadingView.classList.add("hidden");
    resultView.classList.remove("hidden");
    teamName.textContent=currentTeam.name;
    diceFinal.textContent="Your roll: "+(currentTeam.index+1);
    members.innerHTML="";
    members.classList.add("hidden");
    membersBtn.textContent="👥 Show Team Members";
  },10000);
});

membersBtn.addEventListener("click",()=>{
  const show=members.classList.contains("hidden");
  if(show){
    members.innerHTML="<h3>Team Members</h3>";
    currentTeam.members.forEach(([r,n])=>{
      const initials=n.split(/\s+/).map(x=>x[0]).slice(0,2).join("").toUpperCase();
      const row=document.createElement("div");
      row.className="member";
      row.innerHTML=`<div class="avatar">${initials}</div>
        <div><div class="mname">${n}</div><div class="reg">${r}</div></div>`;
      members.appendChild(row);
    });
    members.classList.remove("hidden");
    membersBtn.textContent="🙈 Hide Team Members";
  }else{
    members.classList.add("hidden");
    membersBtn.textContent="👥 Show Team Members";
  }
});

againBtn.addEventListener("click",()=>{
  resultView.classList.add("hidden");
  formView.classList.remove("hidden");
  reg.value=""; nameInput.value=""; error.style.display="none";
  reg.focus();
  dice.classList.add("rolling");
});
</script>
</body>
</html>
