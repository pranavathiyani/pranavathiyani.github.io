<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python — Introductory Concepts &amp; String Manipulation · 40-Question Quiz</title>
<style>
  :root{
    --ink:#1A2E35; --teal:#2A9D8F; --amber:#B9852E; --orange:#C4552F;
    --green:#2A9D8F; --red:#C4552F;
    --paper:#EFF4F3; --line:#DCE4E3; --muted:#5A6B72; --white:#FFFFFF;
    --code-bg:#12222A; --code-tx:#E8EEF0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Calibri,"Segoe UI",system-ui,sans-serif;background:var(--paper);
       color:var(--ink);line-height:1.5;padding:22px 16px 60px}
  .wrap{max-width:840px;margin:0 auto}

  header{margin-bottom:16px}
  .pill{display:inline-block;background:var(--teal);color:#fff;font-size:12px;font-weight:700;
        letter-spacing:2px;padding:5px 14px;border-radius:20px}
  h1{font-family:Cambria,Georgia,serif;font-size:26px;margin:10px 0 3px;font-weight:700}
  .sub{color:var(--muted);font-size:14px}

  /* progress + timer */
  .topbar{display:flex;justify-content:space-between;align-items:center;
          font-size:13px;color:var(--muted);margin:18px 0 6px}
  .prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:4px}
  .prog > i{display:block;height:100%;width:0;background:var(--teal);transition:width .25s}
  .timerwrap{margin:14px 0 4px}
  .timerrow{display:flex;justify-content:space-between;align-items:center;font-size:13px;
            font-weight:700;color:var(--muted);margin-bottom:5px}
  .timerbar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
  .timerbar > i{display:block;height:100%;width:100%;background:var(--teal);
                transition:width .1s linear}
  .timerbar.warn > i{background:var(--orange)}
  #secs.warn{color:var(--orange)}

  .card{background:var(--white);border:1px solid var(--line);border-radius:12px;
        padding:24px 24px 20px;box-shadow:0 2px 10px rgba(26,46,53,.06);margin-top:8px}
  .qnum{font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--teal);
        text-transform:uppercase;margin-bottom:9px}
  .qtag{color:var(--muted);font-weight:700}
  .qtext{font-family:Cambria,Georgia,serif;font-size:20px;font-weight:700;line-height:1.4}
  pre.code{background:var(--code-bg);color:var(--code-tx);font-family:"Courier New",monospace;
           font-size:14.5px;padding:13px 15px;border-radius:8px;margin:13px 0 2px;overflow-x:auto}

  .opts{list-style:none;margin-top:16px}
  .opts li{margin-bottom:10px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
       background:var(--paper);border:1.5px solid var(--line);border-radius:9px;
       padding:12px 14px;font-size:15.5px;font-family:inherit;color:var(--ink);
       transition:border-color .15s,background .15s}
  .opt:hover:not(:disabled){border-color:var(--teal)}
  .opt:disabled{cursor:default}
  .opt:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
  .opt .key{flex:0 0 26px;height:26px;border-radius:50%;background:var(--white);
            border:1.5px solid var(--line);display:grid;place-items:center;
            font-size:13px;font-weight:700;color:var(--muted)}
  .opt code{font-family:"Courier New",monospace;font-size:15px}
  .opt .mark{margin-left:auto;font-weight:700;font-size:18px;display:none}
  .opt.correct{background:#E4EEEC;border-color:var(--green)}
  .opt.correct .key{background:var(--green);border-color:var(--green);color:#fff}
  .opt.correct .mark{display:block;color:var(--green)}
  .opt.wrong{background:#FBEEE9;border-color:var(--red)}
  .opt.wrong .key{background:var(--red);border-color:var(--red);color:#fff}
  .opt.wrong .mark{display:block;color:var(--red)}
  .opt.chosen .key{outline:2px solid var(--ink);outline-offset:1px}

  .expl{margin-top:16px;padding:13px 15px;border-radius:9px;background:#F4F8F7;
        border:1px solid var(--line);font-size:14.5px;color:var(--ink);display:none}
  .expl.show{display:block}
  .expl .lead{font-weight:700;color:var(--teal)}
  .expl.miss .lead{color:var(--orange)}
  .expl code{font-family:"Courier New",monospace;background:var(--paper);padding:1px 5px;
             border-radius:3px;font-size:.92em}

  .nav{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:18px}
  .navmsg{margin-right:auto;font-size:13px;color:var(--muted)}
  button.btn{font-family:inherit;font-size:15px;font-weight:700;padding:11px 26px;
             border-radius:8px;cursor:pointer;border:1.5px solid var(--ink);
             background:var(--ink);color:#fff}
  button.btn:hover:not(:disabled){background:#0f1f26}
  button.btn:disabled{opacity:.35;cursor:not-allowed}
  button.btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

  /* results */
  .score{background:var(--ink);color:#fff;border-radius:12px;padding:26px;text-align:center;
         margin-bottom:20px}
  .score .big{font-family:Cambria,Georgia,serif;font-size:50px;font-weight:700;line-height:1}
  .score .lbl{color:#E9C46A;font-size:15px;margin-top:6px}
  .score .pct{color:#9FB2AE;font-size:14px;margin-top:4px}
  .rev{background:var(--white);border:1px solid var(--line);border-left:5px solid var(--green);
       border-radius:10px;padding:15px 18px;margin-bottom:12px}
  .rev.wrong{border-left-color:var(--red)}
  .rev .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1px;
            text-transform:uppercase;padding:3px 9px;border-radius:4px;margin-bottom:7px;
            background:#E4EEEC;color:var(--green)}
  .rev.wrong .tag{background:#FBEEE9;color:var(--red)}
  .rev .q{font-family:Cambria,Georgia,serif;font-size:16px;font-weight:700;margin-bottom:7px}
  .rev pre.code{font-size:13.5px;margin:7px 0}
  .rev .line{font-size:14.5px;margin:3px 0}
  .rev .line code{font-family:"Courier New",monospace;background:var(--paper);padding:1px 5px;
                  border-radius:3px;font-size:.92em}
  .yc{color:var(--red)} .rc{color:var(--green)}
  .rev .ex{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);
           font-size:14px;color:var(--muted)}
  .again{display:block;margin:24px auto 0}
  @media (max-width:560px){h1{font-size:22px}.qtext{font-size:18px}.card{padding:18px 16px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="pill">PYTHON</span>
    <h1>Introductory Concepts &amp; String Manipulation</h1>
    <p class="sub">40 questions &middot; one at a time &middot; 25 seconds each &middot; the answer is shown before you move on</p>
  </header>

  <div id="quiz">
    <div class="topbar">
      <span id="counter">Question 1 of 40</span>
      <span id="scoreRun">Score 0</span>
    </div>
    <div class="prog"><i id="progFill"></i></div>

    <div class="timerwrap">
      <div class="timerrow"><span>Time for this question</span><span id="secs">25s</span></div>
      <div class="timerbar" id="timerBar"><i id="timerFill"></i></div>
    </div>

    <div class="card">
      <div class="qnum" id="qnum">Question 1 <span class="qtag" id="qtag"></span></div>
      <div class="qtext" id="qtext"></div>
      <pre class="code" id="qcode" hidden></pre>
      <ul class="opts" id="opts"></ul>
      <div class="expl" id="expl"></div>
      <div class="nav">
        <span class="navmsg" id="navmsg">Select an answer, or wait for the timer.</span>
        <button class="btn" id="next" disabled>Next &rarr;</button>
      </div>
    </div>
  </div>

  <div id="results" hidden></div>
</div>

<script>
/* ---------------- question bank ----------------
   c = index of the correct option in the opts array (before shuffling) */
const RAW = [
  {t:"Computational thinking",
   q:"In computational thinking, what does <b>decomposition</b> mean?",
   opts:["Breaking a complex problem into smaller, manageable parts",
         "Removing every detail from a problem",
         "Repeating one step many times",
         "Translating code into machine language"], c:0,
   e:"Decomposition splits a large problem into smaller sub-problems you can solve one at a time."},

  {t:"Computational thinking",
   q:"<b>Abstraction</b> in computational thinking mainly involves:",
   opts:["Focusing on the essential details and ignoring the irrelevant ones",
         "Writing the fastest possible code",
         "Finding and fixing every bug",
         "Saving data into variables"], c:0,
   e:"Abstraction hides unnecessary detail so you can reason about the parts that matter."},

  {t:"Python features",
   q:"Python is best described as a language that is:",
   opts:["Interpreted and dynamically typed",
         "Compiled and statically typed",
         "Assembly-level",
         "Typed only at compile time"], c:0,
   e:"Python runs through an interpreter and decides a value's type at run time."},

  {t:"Python syntax",
   q:"How does Python group statements into a block?",
   opts:["By indentation", "By curly braces { }", "By an 'end' keyword", "By semicolons"], c:0,
   e:"Indentation defines blocks in Python; there are no braces."},

  {t:"Data types",
   q:"What is the type of the value <code>3.0</code>?",
   opts:["float", "int", "str", "complex"], c:0,
   e:"A number written with a decimal point is a float."},

  {t:"Data types",
   q:"Which of these is <b>immutable</b> (cannot be changed in place)?",
   opts:["str", "list", "dict", "set"], c:0,
   e:"Strings are immutable; lists, dicts and sets can all be modified."},

  {t:"Data types",
   q:"What does <code>type(\"42\")</code> return?",
   opts:["&lt;class 'str'&gt;", "&lt;class 'int'&gt;", "&lt;class 'float'&gt;", "an error"], c:0,
   e:"Anything in quotes is a string, no matter what characters are inside."},

  {t:"Operators",
   q:"What is the result of <code>7 // 2</code>?",
   opts:["3", "3.5", "1", "2"], c:0,
   e:"// is floor division: it divides and drops the fractional part."},

  {t:"Arithmetic",
   q:"What is the result of <code>2 ** 3</code>?",
   opts:["8", "6", "9", "23"], c:0,
   e:"** is exponentiation: 2 raised to the power 3."},

  {t:"Arithmetic",
   q:"What does <code>17 % 5</code> evaluate to?",
   opts:["2", "3", "3.4", "12"], c:0,
   e:"% gives the remainder after dividing 17 by 5."},

  {t:"Operators",
   q:"Which operator tests whether two values are equal?",
   opts:["==", "=", "!=", "=&gt;"], c:0,
   e:"== compares values; a single = assigns a value to a variable."},

  {t:"I/O statements",
   q:"What data type does <code>input()</code> always return?",
   opts:["str", "int", "float", "whatever the user types"], c:0,
   e:"input() always returns a string; convert it with int() or float() if you need a number."},

  {t:"I/O statements",
   q:"What does <code>print(\"a\", \"b\", sep=\"-\")</code> display?",
   opts:["a-b", "a b", "ab", "a,b"], c:0,
   e:"sep sets the text placed between the printed items."},

  {t:"Control structures",
   q:"In an if-statement, which keyword runs when none of the conditions are True?",
   opts:["else", "elif", "then", "default"], c:0,
   e:"else catches every case not matched by if or elif."},

  {t:"Control structures", code:"x = 5\nif x > 10:\n    print(\"big\")\nelif x > 3:\n    print(\"medium\")\nelse:\n    print(\"small\")",
   q:"What does this code print?",
   opts:["medium", "big", "small", "nothing"], c:0,
   e:"x > 10 is False, but x > 3 is True, so the elif branch runs."},

  {t:"Control structures",
   q:"What punctuation must end the header line of an <code>if</code> statement?",
   opts:["a colon :", "a semicolon ;", "curly braces { }", "the word then"], c:0,
   e:"The if line ends with a colon, and the block below it is indented."},

  {t:"Looping constructs",
   q:"When looped over, what values does <code>range(3)</code> give?",
   opts:["0, 1, 2", "1, 2, 3", "0, 1, 2, 3", "3"], c:0,
   e:"range starts at 0 and stops before the given number."},

  {t:"Looping constructs",
   q:"Which statement immediately exits the loop entirely?",
   opts:["break", "continue", "pass", "return"], c:0,
   e:"break leaves the loop at once, skipping any remaining iterations."},

  {t:"Looping constructs",
   q:"Which statement skips the rest of the current iteration and moves to the next one?",
   opts:["continue", "break", "skip", "next"], c:0,
   e:"continue jumps straight to the next pass of the loop."},

  {t:"List comprehension",
   q:"What does <code>[x*2 for x in range(3)]</code> produce?",
   opts:["[0, 2, 4]", "[2, 4, 6]", "[0, 1, 2]", "[0, 2, 4, 6]"], c:0,
   e:"x takes 0, 1, 2 and each is doubled."},

  {t:"List comprehension",
   q:"What does <code>[n for n in range(6) if n % 2 == 0]</code> give?",
   opts:["[0, 2, 4]", "[1, 3, 5]", "[2, 4, 6]", "[0, 1, 2, 3, 4, 5]"], c:0,
   e:"The condition keeps only the even numbers from 0 to 5."},

  {t:"Lists",
   q:"Which brackets are used to write a list?",
   opts:["[ ]", "( )", "{ }", "&lt; &gt;"], c:0,
   e:"Square brackets create a list."},

  {t:"Lists",
   q:"Given <code>nums = [10, 20, 30]</code>, what is <code>nums[-1]</code>?",
   opts:["30", "10", "20", "an error"], c:0,
   e:"Index -1 refers to the last item."},

  {t:"Tuples",
   q:"Which statement about tuples is true?",
   opts:["They cannot be changed after they are created",
         "They are written with square brackets",
         "They automatically remove duplicates",
         "They map keys to values"], c:0,
   e:"Tuples are immutable; that is the key difference from lists."},

  {t:"Tuples",
   q:"How do you create a tuple containing a single item, 5?",
   opts:["(5,)", "(5)", "[5]", "{5}"], c:0,
   e:"The trailing comma makes it a tuple; (5) is just the number 5 in brackets."},

  {t:"Dictionaries",
   q:"A dictionary stores its data as:",
   opts:["key-value pairs", "a single ordered list", "unique unordered items", "a fixed sequence"], c:0,
   e:"A dict maps each key to a value."},

  {t:"Dictionaries",
   q:"Given <code>d = {\"a\": 1, \"b\": 2}</code>, how do you get the value 2?",
   opts:["d[\"b\"]", "d[2]", "d.b", "d(1)"], c:0,
   e:"You access a dictionary value by its key in square brackets."},

  {t:"Dictionaries",
   q:"Which method returns a default value instead of an error when a key is missing?",
   opts:["get()", "pop()", "keys()", "items()"], c:0,
   e:"d.get(key, default) avoids a KeyError when the key is absent."},

  {t:"Sets",
   q:"What does <code>set([1, 2, 2, 3])</code> give?",
   opts:["{1, 2, 3}", "[1, 2, 2, 3]", "{1, 2, 2, 3}", "(1, 2, 3)"], c:0,
   e:"A set stores each value only once, so the duplicate 2 is dropped."},

  {t:"Sets",
   q:"For two sets <code>a</code> and <code>b</code>, which operator gives the items common to both?",
   opts:["a &amp; b", "a | b", "a - b", "a + b"], c:0,
   e:"& is intersection: the items present in both sets."},

  {t:"Functions",
   q:"Which keyword begins a function definition?",
   opts:["def", "function", "func", "define"], c:0,
   e:"Functions are defined with the def keyword."},

  {t:"Functions",
   q:"What does a function return if it has no <code>return</code> statement?",
   opts:["None", "0", "an empty string", "an error"], c:0,
   e:"Without an explicit return, a function returns None."},

  {t:"Strings",
   q:"Given <code>s = \"PYTHON\"</code>, what is <code>s[0]</code>?",
   opts:["\"P\"", "\"Y\"", "\"N\"", "\"O\""], c:0,
   e:"String indexing starts at 0, so s[0] is the first character."},

  {t:"Strings",
   q:"Given <code>s = \"PYTHON\"</code>, what does <code>s[1:4]</code> give?",
   opts:["\"YTH\"", "\"PYT\"", "\"YTHO\"", "\"PYTH\""], c:0,
   e:"A slice goes from index 1 up to but not including index 4."},

  {t:"String formatting",
   q:"What does the f-string <code>f\"{3 + 4}\"</code> produce?",
   opts:["\"7\"", "\"3 + 4\"", "\"34\"", "\"{3 + 4}\""], c:0,
   e:"An f-string evaluates the expression inside the braces."},

  {t:"String formatting",
   q:"What does <code>\"ab\" * 3</code> give?",
   opts:["\"ababab\"", "\"ab3\"", "\"abababab\"", "an error"], c:0,
   e:"Multiplying a string by an integer repeats it that many times."},

  {t:"Searching strings",
   q:"What does <code>\"banana\".count(\"a\")</code> return?",
   opts:["3", "2", "1", "0"], c:0,
   e:"There are three 'a' characters in 'banana'."},

  {t:"Searching strings",
   q:"What does <code>\"hello\".find(\"l\")</code> return?",
   opts:["2", "3", "1", "-1"], c:0,
   e:"find returns the index of the first match; the first 'l' is at index 2."},

  {t:"Splitting strings",
   q:"What does <code>\"a,b,c\".split(\",\")</code> return?",
   opts:["['a', 'b', 'c']", "'abc'", "['a,b,c']", "('a', 'b', 'c')"], c:0,
   e:"split breaks the string at each separator and returns a list of pieces."},

  {t:"Joining strings",
   q:"What does <code>\"-\".join([\"1\", \"2\", \"3\"])</code> return?",
   opts:["\"1-2-3\"", "\"123\"", "\"1,2,3\"", "[\"1-2-3\"]"], c:0,
   e:"join glues the list items together with the separator between them."},
];

/* ---------------- setup ---------------- */
const QTIME = 25;                 // seconds per question
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

let QUESTIONS = [];
function buildQuiz(){
  QUESTIONS = shuffle(RAW.map(function(item){
    // shuffle options, remembering which is correct
    const tagged = item.opts.map(function(txt,i){ return {txt:txt, ok:(i===item.c)}; });
    shuffle(tagged);
    return {
      t:item.t, q:item.q, code:item.code||null, e:item.e,
      opts:tagged.map(function(o){return o.txt;}),
      correct:tagged.findIndex(function(o){return o.ok;})
    };
  }));
}

const N = RAW.length;
let cur = 0, score = 0, revealed = false, timer = null, timeLeft = QTIME;
let responses = [];               // {choice: idx|null, correct: idx, timedOut: bool}

const $ = function(id){ return document.getElementById(id); };
const esc = function(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); };
// options / questions may already contain intended entities, so only escape raw code strings
const escCode = esc;

function startTimer(){
  timeLeft = QTIME;
  paintTimer();
  timer = setInterval(function(){
    timeLeft -= 0.1;
    if(timeLeft <= 0){
      timeLeft = 0; paintTimer(); clearInterval(timer);
      if(!revealed) doReveal(true);           // time up, no answer
    } else {
      paintTimer();
    }
  }, 100);
}
function paintTimer(){
  const pct = Math.max(0, timeLeft / QTIME * 100);
  $("timerFill").style.width = pct + "%";
  const s = Math.ceil(timeLeft);
  $("secs").textContent = s + "s";
  const warn = timeLeft <= 5;
  $("timerBar").classList.toggle("warn", warn);
  $("secs").classList.toggle("warn", warn);
}

function render(){
  revealed = false;
  const Q = QUESTIONS[cur];
  $("qnum").innerHTML = "Question " + (cur+1) + " <span class='qtag'>&middot; " + esc(Q.t) + "</span>";
  $("qtext").innerHTML = Q.q;                 // trusted authored markup
  const codeEl = $("qcode");
  if(Q.code){ codeEl.textContent = Q.code; codeEl.hidden = false; }
  else { codeEl.hidden = true; }

  const ul = $("opts"); ul.innerHTML = "";
  Q.opts.forEach(function(text,i){
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button"; b.className = "opt";
    b.innerHTML = '<span class="key">'+"ABCD"[i]+'</span><code>'+text+'</code><span class="mark"></span>';
    b.onclick = function(){ if(!revealed){ responses[cur].choice = i; doReveal(false); } };
    li.appendChild(b); ul.appendChild(li);
  });

  const ex = $("expl"); ex.className = "expl"; ex.innerHTML = "";
  $("next").disabled = true;
  $("next").textContent = (cur === N-1) ? "See results" : "Next \u2192";
  $("navmsg").textContent = "Select an answer, or wait for the timer.";
  $("counter").textContent = "Question " + (cur+1) + " of " + N;
  $("scoreRun").textContent = "Score " + score;
  $("progFill").style.width = ((cur) / N * 100) + "%";

  startTimer();
}

function doReveal(timedOut){
  revealed = true;
  clearInterval(timer);
  const Q = QUESTIONS[cur];
  responses[cur].timedOut = timedOut;
  const chosen = responses[cur].choice;
  const isRight = (chosen === Q.correct);
  if(isRight){ score++; $("scoreRun").textContent = "Score " + score; }

  const btns = $("opts").querySelectorAll(".opt");
  btns.forEach(function(b,i){
    b.disabled = true;
    const mark = b.querySelector(".mark");
    if(i === Q.correct){ b.classList.add("correct"); mark.textContent = "\u2713"; }
    if(i === chosen && chosen !== Q.correct){ b.classList.add("wrong"); mark.textContent = "\u2717"; }
    if(i === chosen){ b.classList.add("chosen"); }
  });

  const ex = $("expl");
  let lead;
  if(timedOut && chosen === null) lead = "Time's up.";
  else if(isRight) lead = "Correct.";
  else lead = "Not quite.";
  ex.className = "expl show" + (isRight ? "" : " miss");
  ex.innerHTML = '<span class="lead">'+lead+'</span> '+Q.e;

  $("next").disabled = false;
  $("navmsg").textContent = (cur === N-1) ? "That was the last question." : "Answer shown \u2014 move on when ready.";
}

$("next").onclick = function(){
  if(!revealed) return;
  if(cur < N-1){ cur++; render(); }
  else { showResults(); }
};

function showResults(){
  clearInterval(timer);
  const pct = Math.round(score / N * 100);
  const label = pct >= 80 ? "Excellent \u2014 strong across the unit"
              : pct >= 60 ? "Good \u2014 review the ones you missed"
              : pct >= 40 ? "Getting there \u2014 revisit the weak spots"
              : "Worth another run once you've reviewed";
  let html = '<div class="score"><div class="big">'+score+' / '+N+'</div>'
           + '<div class="lbl">'+label+'</div><div class="pct">'+pct+'% correct</div></div>';

  QUESTIONS.forEach(function(Q,i){
    const r = responses[i];
    const ok = (r.choice === Q.correct);
    let yourLine;
    if(r.choice === null) yourLine = '<div class="line yc"><b>Your answer:</b> no answer (timed out)</div>';
    else if(!ok) yourLine = '<div class="line yc"><b>Your answer:</b> <code>'+Q.opts[r.choice]+'</code></div>';
    else yourLine = '';
    html += '<div class="rev'+(ok?'':' wrong')+'">'
          + '<span class="tag">Q'+(i+1)+' &middot; '+esc(Q.t)+' &middot; '+(ok?'Correct':'Review')+'</span>'
          + '<div class="q">'+Q.q+'</div>'
          + (Q.code ? '<pre class="code">'+escCode(Q.code)+'</pre>' : '')
          + yourLine
          + '<div class="line rc"><b>Correct answer:</b> <code>'+Q.opts[Q.correct]+'</code></div>'
          + '<div class="ex">'+Q.e+'</div>'
          + '</div>';
  });
  html += '<button class="btn again" id="again">Restart (reshuffles everything)</button>';

  $("quiz").hidden = true;
  const res = $("results"); res.hidden = false; res.innerHTML = html;
  window.scrollTo({top:0, behavior:"smooth"});
  $("again").onclick = function(){ startOver(); };
}

function startOver(){
  buildQuiz();
  responses = QUESTIONS.map(function(Q){ return {choice:null, correct:Q.correct, timedOut:false}; });
  cur = 0; score = 0;
  $("results").hidden = true; $("quiz").hidden = false;
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ---- go ---- */
buildQuiz();
responses = QUESTIONS.map(function(Q){ return {choice:null, correct:Q.correct, timedOut:false}; });
render();
</script>
