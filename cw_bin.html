<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIN104 Crossword — Bioinformatics I</title>
<style>
 :root{--ink:#0B3B3C;--teal:#0E7C7B;--teal2:#12968F;--cream:#FBF7EF;--gold:#E8A33A;--coral:#E9724C;

 *{box-sizing:border-box;margin:0;padding:0;}
 html,body{height:100%;}
 body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
   background:radial-gradient(circle at 50% -20%,#14514f,#0B3B3C 65%);color:var(--ink);
   height:100dvh;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:14px;
   -webkit-user-select:none;user-select:none;}
 .card{background:var(--cream);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.35);
   width:100%;max-width:1060px;height:100%;max-height:720px;display:flex;flex-direction:column;overflow:hidden;}
 header{padding:12px 20px 10px;border-bottom:1px solid var(--line);}
 .ttl{font-size:20px;font-weight:800;color:var(--ink);}
 .ttl span{color:var(--gold);}
 .sub{font-size:12px;color:var(--muted);margin-top:1px;}
 .cluebar{margin-top:8px;background:#fff;border:2px solid var(--teal);border-radius:10px;padding:9px 13px;
   min-height:46px;display:flex;align-items:center;gap:10px;}
 .cluebar .tag{flex:0 0 auto;background:var(--teal);color:#fff;font-weight:800;font-size:12px;border-radius:6px;padding:4px 9px;letter-spacing:.3px;}
 .cluebar .txt{font-size:15px;color:var(--ink);font-weight:600;}
 .cluebar .ph{color:var(--muted);font-weight:500;font-style:italic;}
 main{flex:1;display:flex;gap:16px;padding:14px 20px 8px;min-height:0;}
 .gridwrap{flex:0 0 auto;display:flex;align-items:flex-start;justify-content:center;}
 .grid{display:grid;grid-template-columns:repeat(19,var(--cell));grid-template-rows:repeat(19,var(--cell));
   gap:0;background:var(--ink);border:3px solid var(--ink);border-radius:4px;}
 .blk{background:var(--ink);}
 .cell{position:relative;background:#fff;border:1px solid #cfc3ad;}
 .cell input{position:absolute;inset:0;width:100%;height:100%;border:none;background:transparent;text-align:center;
   font-size:calc(var(--cell)*0.55);font-weight:700;color:var(--ink);text-transform:uppercase;outline:none;padding:0;caret-color:var(--teal);}
 .cell .num{position:absolute;top:1px;left:2px;font-size:calc(var(--cell)*0.30);color:var(--muted);font-weight:700;line-height:1;pointer-events:none;}
 .cell.hl{background:#dff3f0;} .cell.cur{background:#bfe8e2;}
 .cell.ok input{color:var(--good);} .cell.ok{background:#e7f6ef;}
 .cell.err input{color:var(--bad);} .cell.err{background:#fcebe6;}
 .clues{flex:1;display:flex;gap:18px;min-width:0;overflow-y:auto;padding-right:4px;}
 .col{flex:1;min-width:0;}
 .col h3{font-size:13px;font-weight:800;color:var(--teal);letter-spacing:1px;margin-bottom:6px;position:sticky;top:0;background:var(--cream);padding:2px 0;}
 .col ul{list-style:none;}
 .col li{font-size:12.5px;line-height:1.4;margin-bottom:5px;cursor:pointer;color:#2c3f3d;border-radius:5px;padding:2px 5px;}
 .col li:hover{background:#eee5d3;}
 .col li.active{background:#dff3f0;color:var(--ink);font-weight:600;}
 .col li b{color:var(--ink);margin-right:3px;}
 footer{border-top:1px solid var(--line);padding:9px 20px;display:flex;align-items:center;gap:10px;}
 .btn{border:none;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:800;cursor:pointer;}
 .btn.p{background:var(--teal);color:#fff;} .btn.p:hover{background:#0c6b6a;}
 .btn.g{background:transparent;color:var(--teal);border:2px solid var(--teal);}
 .status{font-size:13px;font-weight:700;color:var(--muted);margin-left:auto;}
 @media(max-width:820px){:root{--cell:24px;} main{flex-direction:column;overflow-y:auto;} .clues{overflow:visible;}}
 @media print{body{background:#fff;height:auto;overflow:visible;}.card{box-shadow:none;max-height:none;height:auto;}footer .btn{display:none;}}
</style></head>

   <button class="btn p" id="checkBtn">Check</button>

</div>

const R=DATA.rows,C=DATA.cols;
const black=[];for(let r=0;r<R;r++){black[r]=[];for(let c=0;c<C;c++)black[r][c]=true;}
DATA.cells.forEach(c=>black[c.r][c.c]=false);
const numAt={};DATA.cells.forEach(c=>{if(c.n)numAt[c.r+","+c.c]=c.n;});
const inp={};
const grid=document.getElementById("grid");
for(let r=0;r<R;r++)for(let c=0;c<C;c++){
  if(black[r][c]){const d=document.createElement("div");d.className="blk";grid.appendChild(d);continue;}
  const cell=document.createElement("div");cell.className="cell";cell.dataset.r=r;cell.dataset.c=c;
  const n=numAt[r+","+c];if(n){const s=document.createElement("span");s.className="num";s.textContent=n;cell.appendChild(s);}
  const box=document.createElement("input");box.maxLength=1;box.dataset.r=r;box.dataset.c=c;
  cell.appendChild(box);grid.appendChild(cell);inp[r+","+c]=box;
  cell.addEventListener("click",()=>focusCell(r,c,true));
  box.addEventListener("keydown",e=>onKey(e,r,c));
  box.addEventListener("input",()=>onInput(r,c));
}
let dir="A",active=[];
function wordCells(r,c,d){
  const cells=[];let sr=r,sc=c;
  if(d=="A"){while(!black[sr][sc-1] && sc-1>=0 && !black[sr][sc-1])sc--;while(sc>0 && !black[r][sc-1])sc--;
    let cc=sc;while(cc<C && !black[r][cc]){cells.push([r,cc]);cc++;}}
  else{let rr=r;while(rr>0 && !black[rr-1][c])rr--;let k=rr;while(k<R && !black[k][c]){cells.push([k,c]);k++;}}
  return cells;
}
function hasDir(r,c,d){
  if(d=="A")return (c>0&&!black[r][c-1])||(c<C-1&&!black[r][c+1]);
  return (r>0&&!black[r-1][c])||(r<R-1&&!black[r+1][c]);
}
function focusCell(r,c,click){
  if(black[r][c])return;
  if(click){ if(active.length && active[0][0]===r && active[0][1]===c){ /*same*/ }
    if(hasDir(r,c,dir)){} else dir=(dir=="A"?"D":"A");
    if(!hasDir(r,c,dir))dir=(dir=="A"?"D":"A");
    // toggle if clicking current cell again
  }
  if(!hasDir(r,c,dir))dir=hasDir(r,c,"A")?"A":"D";
  highlight(r,c);inp[r+","+c].focus();
}
function toggleDir(r,c){ if(hasDir(r,c,"A")&&hasDir(r,c,"D")){dir=(dir=="A"?"D":"A");} }

  document.querySelectorAll(".cell").forEach(e=>e.classList.remove("hl","cur"));

}
function startOf(cells){return cells[0];}
function showClueFor(r,c){
  const cells=wordCells(r,c,dir);const [sr,sc]=startOf(cells);const num=numAt[sr+","+sc];
  const list=(dir=="A"?DATA.across:DATA.down);const e=list.find(x=>x.n===num && x.r===sr && x.c===sc);

  markClueList(num,dir);
}
function markClueList(num,d){
  document.querySelectorAll(".col li").forEach(li=>li.classList.remove("active"));
  const id=(d=="A"?"a":"d")+num;const li=document.getElementById(id);if(li)li.classList.add("active");
}
function onInput(r,c){
  const v=inp[r+","+c].value.toUpperCase().replace(/[^A-Z]/g,"");
  inp[r+","+c].value=v;clearMark(r,c);
  if(v){const nx=nextCell(r,c);if(nx)focusCell(nx[0],nx[1],false);}
}
function nextCell(r,c){const cells=wordCells(r,c,dir);const i=cells.findIndex(x=>x[0]===r&&x[1]===c);
  for(let k=i+1;k<cells.length;k++)return cells[k];return null;}
function prevCell(r,c){const cells=wordCells(r,c,dir);const i=cells.findIndex(x=>x[0]===r&&x[1]===c);
  if(i>0)return cells[i-1];return null;}
function onKey(e,r,c){
  if(e.key==="Backspace"){if(!inp[r+","+c].value){const p=prevCell(r,c);if(p){inp[p[0]+","+p[1]].value="";clearMark(p[0],p[1]);focusCell(p[0],p[1],false);e.preventDefault();}}return;}
  if(e.key==="ArrowRight"){dir="A";step(r,c,0,1);e.preventDefault();}
  else if(e.key==="ArrowLeft"){dir="A";step(r,c,0,-1);e.preventDefault();}
  else if(e.key==="ArrowDown"){dir="D";step(r,c,1,0);e.preventDefault();}
  else if(e.key==="ArrowUp"){dir="D";step(r,c,-1,0);e.preventDefault();}
  else if(e.key===" "){toggleDir(r,c);highlight(r,c);e.preventDefault();}
}
function step(r,c,dr,dc){let nr=r+dr,nc=c+dc;while(nr>=0&&nr<R&&nc>=0&&nc<C){if(!black[nr][nc]){focusCell(nr,nc,false);return;}nr+=dr;nc+=dc;}}
function clearMark(r,c){inp[r+","+c].parentElement.classList.remove("ok","err");}
// clue lists
function fillList(list,elId,d){
  const ul=document.getElementById(elId);
  list.forEach(e=>{const li=document.createElement("li");li.id=(d=="A"?"a":"d")+e.n;
    li.innerHTML=`<b>${e.n}.</b>${e.clue}`;li.onclick=()=>{dir=d;highlight(e.r,e.c);inp[e.r+","+e.c].focus();};ul.appendChild(li);});
}
fillList(DATA.across,"acrossList","A");fillList(DATA.down,"downList","D");
// check / clear  (never reveals a letter)
function solGrid(){const s=atob(DATA.sol).split("").reverse().join("");const g=[];let k=0;
  for(let r=0;r<R;r++){g[r]=[];for(let c=0;c<C;c++){g[r][c]=s[k++];}}return g;}

  const g=solGrid();let right=0,filled=0,total=DATA.cells.length;
  DATA.cells.forEach(({r,c})=>{const box=inp[r+","+c];clearMark(r,c);const v=box.value.toUpperCase();
    if(v){filled++;if(v===g[r][c]){box.parentElement.classList.add("ok");right++;}else box.parentElement.classList.add("err");}});
  document.getElementById("status").textContent=`${right}/${total} correct · ${filled} filled`;
};
document.getElementById("clearBtn").onclick=()=>{
  DATA.cells.forEach(({r,c})=>{inp[r+","+c].value="";clearMark(r,c);});
  document.getElementById("status").textContent="";document.getElementById("cluebar").innerHTML='<span class="ph">Click any numbered cell or a clue to begin…</span>';
};
